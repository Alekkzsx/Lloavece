[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-brasileira"
version = "0.1.0"
description = "Uma Inteligência Artificial criada do zero, com alma brasileira."
authors = [
    {name = "Lloavece LLM Team", email = "equipe@ia-brasileira.com.br"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "triton>=2.2.0",
    "deepspeed>=0.14.0",
    "wandb",
    "numpy",
    "pandas",
    "tqdm",
    "rich",
    "trafilatura",
    "fasttext",
    "vllm",
    "fastapi",
    "uvicorn"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "notebook",
    "ipywidgets"
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
