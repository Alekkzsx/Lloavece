[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lloavece-coder"
version = "0.2.0"
description = "A Primeira Grande Inteligência Artificial de Código Nativa do Brasil."
authors = [
    {name = "Lloavece Team", email = "contato@lloavece.com.br"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "sentencepiece>=0.2.0",
    "datasets>=2.16.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "crcmod>=1.7",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort"
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
