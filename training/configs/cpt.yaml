# Configuração de Treinamento CPT - Lloavece Kode
# ================================================

# Modelo Base
model:
  name: "Qwen/Qwen3.8-27B"
  trust_remote_code: true
  torch_dtype: "bfloat16"

# Dados
data:
  train_file: "data/training/train.jsonl"
  val_file: "data/training/validation.jsonl"
  max_seq_length: 4096
  num_workers: 4

# LoRA
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

# Quantização (opcional - para QLoRA)
quantization:
  enabled: false
  load_in_4bit: true
  bnb_4bit_use_double_quant: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"

# Treinamento
training:
  output_dir: "models/cpt"
  num_epochs: 2
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_steps: 100
  lr_scheduler: "cosine"
  max_grad_norm: 1.0
  optimizer: "adamw_torch"
  seed: 42

# DeepSpeed
deepspeed:
  enabled: true
  zero_stage: 2
  gradient_clipping: 1.0
  overlap_comm: true
  contiguous_gradients: true

# Otimizações
optimizations:
  gradient_checkpointing: true
  activation_checkpointing: true
  compile_model: false  # PyTorch 2.0+

# Logging
logging:
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
  save_total_limit: 3
  report_to: "wandb"

# Weights & Biases
wandb:
  enabled: true
  project: "lloavece-kode"
  name: "cpt-qwen3.8-27b"
  tags:
    - "cpt"
    - "qwen3.8"
    - "27b"

# Avaliação
evaluation:
  enabled: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  load_best_model_at_end: true

# Checkpoint
checkpoint:
  save_strategy: "steps"
  save_total_limit: 3
  resume_from_checkpoint: null  # Caminho para checkpoint

# Hiperparâmetros Avançados
advanced:
  # Learning rate scheduling
  lr_scheduler_kwargs:
    num_cycles: 0.5
  
  # Gradient accumulation
  gradient_accumulation_kwargs:
    gradient_accumulation: true
    delay_optimizer: true
  
  # Memory optimization
  memory_efficient: true
  use_flash_attention: true  # Se disponível

# Data Augmentation (opcional)
augmentation:
  enabled: false
  techniques:
    - "back_translation"
    - "synonym_replacement"
  probability: 0.1

# Early Stopping (opcional)
early_stopping:
  enabled: false
  patience: 3
  threshold: 0.01

# Distributed Training
distributed:
  backend: "nccl"
  find_unused_parameters: false
